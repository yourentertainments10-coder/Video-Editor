[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poc"
version = "0.1.0"
description = "MVP v0 proof of concept: deterministic, beat-synced automatic video editing."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pydantic>=2.6",
    "imageio-ffmpeg>=0.5",
    "av>=14.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
